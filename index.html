<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seni Seviyorum 🌹</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Great+Vibes&family=Caveat:wght@700&family=Parisienne&family=Tangerine:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505;
            height: 100vh;
            overflow: hidden;
            font-family: 'Dancing Script', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(255, 0, 0, 0.05) 0%, transparent 70%);
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 107, 157, 0.05) 0%, transparent 50%);
            z-index: 0;
        }

        /* Canvas */
        #pixelCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Pixel yazı - NEİRİMMMMMM ❤️ */
        .pixel-title {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Press Start 2P', monospace;
            font-size: 35px;
            color: #fff;
            letter-spacing: 10px;
            z-index: 10;
            text-align: center;
            white-space: nowrap;
            background: linear-gradient(180deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.5));
            animation: pixelFloat 3s ease-in-out infinite;
            transition: all 0.5s ease;
        }

        @keyframes pixelFloat {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        .pixel-title::after {
            content: '❤️';
            font-size: 30px;
            margin-left: 10px;
            filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.8));
            animation: heartBeat 1.5s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            40% { transform: scale(1); }
            60% { transform: scale(1.2); }
        }

        /* El yazısı - Seni seviyorum */
        .love-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Parisienne', cursive;
            font-size: 90px;
            color: #fff;
            cursor: pointer;
            z-index: 10;
            text-align: center;
            text-shadow: 
                0 0 30px rgba(255, 255, 255, 0.6),
                0 0 60px rgba(255, 215, 0, 0.4),
                0 0 90px rgba(255, 107, 157, 0.3);
            transition: all 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            animation: loveFadeIn 3s ease;
            letter-spacing: 3px;
            line-height: 1.2;
        }

        @keyframes loveFadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3) rotate(-15deg);
                filter: blur(20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1) rotate(0);
                filter: blur(0);
            }
        }

        .love-text:hover {
            transform: translate(-50%, -50%) scale(1.1);
            text-shadow: 
                0 0 50px rgba(255, 255, 255, 1),
                0 0 100px rgba(255, 215, 0, 0.8),
                0 0 150px rgba(255, 107, 157, 0.6);
        }

        .love-text.animate {
            animation: loveZoom 2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes loveZoom {
            0% {
                transform: translate(-50%, -50%) scale(1);
                filter: brightness(1);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.5);
                filter: brightness(2);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                filter: brightness(1);
            }
        }

        /* Mektup Modal */
        .letter-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .letter-modal.active {
            display: flex;
            opacity: 1;
        }

        .letter-content {
            background: linear-gradient(145deg, #1a1a2e, #2d2d3d, #1a1a2e);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 30px;
            padding: 70px;
            max-width: 750px;
            width: 90%;
            text-align: center;
            position: relative;
            animation: letterIn 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 
                0 0 60px rgba(255, 215, 0, 0.2),
                0 0 120px rgba(255, 107, 157, 0.1),
                inset 0 0 40px rgba(255, 255, 255, 0.03);
        }

        @keyframes letterIn {
            from {
                opacity: 0;
                transform: scale(0.3) rotate(-15deg) translateY(50px);
                filter: blur(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0) translateY(0);
                filter: blur(0);
            }
        }

        .letter-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffd700;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s;
        }

        .letter-close:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .letter-header {
            font-family: 'Great Vibes', cursive;
            font-size: 50px;
            color: #ffd700;
            margin-bottom: 40px;
            letter-spacing: 3px;
            text-shadow: 
                0 0 30px rgba(255, 215, 0, 0.6),
                0 0 60px rgba(255, 215, 0, 0.3);
            animation: headerGlow 3s ease-in-out infinite;
        }

        @keyframes headerGlow {
            0%, 100% { text-shadow: 0 0 30px rgba(255, 215, 0, 0.6), 0 0 60px rgba(255, 215, 0, 0.3); }
            50% { text-shadow: 0 0 50px rgba(255, 215, 0, 0.8), 0 0 100px rgba(255, 215, 0, 0.5); }
        }

        .letter-text {
            font-family: 'Tangerine', cursive;
            font-size: 45px;
            color: #fff;
            line-height: 1.4;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .letter-signature {
            font-family: 'Great Vibes', cursive;
            font-size: 50px;
            color: #ff6b9d;
            margin-top: 30px;
            text-shadow: 
                0 0 30px rgba(255, 107, 157, 0.6),
                0 0 60px rgba(255, 107, 157, 0.3);
            animation: signaturePulse 2s ease-in-out infinite;
        }

        @keyframes signaturePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Pixel düşen parçalar */
        .falling-piece {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #c0392b;
            box-shadow: 0 0 8px rgba(192, 57, 43, 0.8);
            opacity: 0;
            animation: pieceFall linear forwards;
        }

        @keyframes pieceFall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Canvas -->
    <canvas id="pixelCanvas"></canvas>

    <!-- Pixel Yazı - NEİRİMMMMMM ❤️ -->
    <div class="pixel-title" id="pixelTitle">NEİRİMMMMMM</div>

    <!-- El Yazısı - Seni Seviyorum -->
    <div class="love-text" id="loveText" onclick="handleLoveClick()">Seni seviyorum</div>

    <!-- Mektup Modal -->
    <div class="letter-modal" id="letterModal">
        <div class="letter-content">
            <div class="letter-close" onclick="closeLetter()">✕</div>
            <div class="letter-header">Sevgili Eşim,</div>
            <div class="letter-text">
                Bugüne kadar iyi ve kötü günlerimde<br>
                benimle olduğun için sana çok teşekkür ederim.<br>
                Rabbim bizi hiç ayırmasın.<br>
                Sevgilimmmm ❤️
            </div>
            <div class="letter-signature">Sonsuza dek seninim 💍</div>
        </div>
    </div>

    <script>
        // Canvas ayarları
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Gülün pixel verileri (görseldeki kırmızı gül)
        const rosePixels = [
            // Gülün taç yaprakları (üst kısım)
            { x: 0.50, y: 0.35, color: '#c0392b' },
            { x: 0.48, y: 0.33, color: '#e74c3c' },
            { x: 0.52, y: 0.33, color: '#e74c3c' },
            { x: 0.46, y: 0.36, color: '#c0392b' },
            { x: 0.54, y: 0.36, color: '#c0392b' },
            { x: 0.50, y: 0.30, color: '#e74c3c' },
            { x: 0.44, y: 0.40, color: '#c0392b' },
            { x: 0.56, y: 0.40, color: '#c0392b' },
            { x: 0.42, y: 0.44, color: '#a93226' },
            { x: 0.58, y: 0.44, color: '#a93226' },
            // Gülün merkezi
            { x: 0.50, y: 0.38, color: '#a93226' },
            { x: 0.48, y: 0.40, color: '#c0392b' },
            { x: 0.52, y: 0.40, color: '#c0392b' },
            { x: 0.50, y: 0.42, color: '#e74c3c' },
            // Gülün alt yaprakları
            { x: 0.46, y: 0.46, color: '#c0392b' },
            { x: 0.54, y: 0.46, color: '#c0392b' },
            { x: 0.48, y: 0.48, color: '#a93226' },
            { x: 0.52, y: 0.48, color: '#a93226' },
            { x: 0.50, y: 0.50, color: '#c0392b' },
            // Gülün sapı
            { x: 0.50, y: 0.55, color: '#1e8449' },
            { x: 0.50, y: 0.60, color: '#1e8449' },
            { x: 0.50, y: 0.65, color: '#1e8449' },
            { x: 0.50, y: 0.70, color: '#1e8449' },
            { x: 0.50, y: 0.75, color: '#1e8449' },
            { x: 0.50, y: 0.80, color: '#1e8449' },
            { x: 0.50, y: 0.85, color: '#1e8449' },
            { x: 0.50, y: 0.90, color: '#1e8449' },
            // Sol yaprak
            { x: 0.44, y: 0.65, color: '#27ae60' },
            { x: 0.42, y: 0.63, color: '#2ecc71' },
            { x: 0.40, y: 0.65, color: '#27ae60' },
            { x: 0.42, y: 0.67, color: '#2ecc71' },
            { x: 0.38, y: 0.66, color: '#27ae60' },
            { x: 0.44, y: 0.68, color: '#2ecc71' },
            // Sağ yaprak
            { x: 0.56, y: 0.70, color: '#27ae60' },
            { x: 0.58, y: 0.68, color: '#2ecc71' },
            { x: 0.60, y: 0.70, color: '#27ae60' },
            { x: 0.58, y: 0.72, color: '#2ecc71' },
            { x: 0.62, y: 0.71, color: '#27ae60' },
            { x: 0.56, y: 0.73, color: '#2ecc71' },
            // Ekstra detaylar
            { x: 0.47, y: 0.34, color: '#e74c3c' },
            { x: 0.53, y: 0.34, color: '#e74c3c' },
            { x: 0.45, y: 0.38, color: '#c0392b' },
            { x: 0.55, y: 0.38, color: '#c0392b' },
            { x: 0.49, y: 0.44, color: '#a93226' },
            { x: 0.51, y: 0.44, color: '#a93226' }
        ];

        // Pixel yazı - NEİRİMMMMMM ❤️ (pixel harf desenleri)
        const textPixels = [
            // N harfi
            { x: 0.30, y: 0.10, char: 'N' },
            { x: 0.30, y: 0.12, char: 'N' },
            { x: 0.30, y: 0.14, char: 'N' },
            { x: 0.30, y: 0.16, char: 'N' },
            { x: 0.30, y: 0.18, char: 'N' },
            { x: 0.32, y: 0.12, char: 'N' },
            { x: 0.34, y: 0.14, char: 'N' },
            { x: 0.36, y: 0.16, char: 'N' },
            { x: 0.38, y: 0.10, char: 'N' },
            { x: 0.38, y: 0.12, char: 'N' },
            { x: 0.38, y: 0.14, char: 'N' },
            { x: 0.38, y: 0.16, char: 'N' },
            { x: 0.38, y: 0.18, char: 'N' },
            // E harfi
            { x: 0.44, y: 0.10, char: 'E' },
            { x: 0.44, y: 0.12, char: 'E' },
            { x: 0.44, y: 0.14, char: 'E' },
            { x: 0.44, y: 0.16, char: 'E' },
            { x: 0.44, y: 0.18, char: 'E' },
            { x: 0.48, y: 0.10, char: 'E' },
            { x: 0.48, y: 0.14, char: 'E' },
            { x: 0.48, y: 0.18, char: 'E' },
            // İ harfi
            { x: 0.54, y: 0.10, char: 'İ' },
            { x: 0.54, y: 0.12, char: 'İ' },
            { x: 0.54, y: 0.14, char: 'İ' },
            { x: 0.54, y: 0.16, char: 'İ' },
            { x: 0.54, y: 0.18, char: 'İ' },
            // R harfi
            { x: 0.60, y: 0.10, char: 'R' },
            { x: 0.60, y: 0.12, char: 'R' },
            { x: 0.60, y: 0.14, char: 'R' },
            { x: 0.60, y: 0.16, char: 'R' },
            { x: 0.60, y: 0.18, char: 'R' },
            { x: 0.64, y: 0.10, char: 'R' },
            { x: 0.64, y: 0.12, char: 'R' },
            { x: 0.64, y: 0.14, char: 'R' },
            { x: 0.62, y: 0.16, char: 'R' },
            { x: 0.64, y: 0.18, char: 'R' },
            // İ harfi
            { x: 0.70, y: 0.10, char: 'İ' },
            { x: 0.70, y: 0.12, char: 'İ' },
            { x: 0.70, y: 0.14, char: 'İ' },
            { x: 0.70, y: 0.16, char: 'İ' },
            { x: 0.70, y: 0.18, char: 'İ' },
            // M harfi
            { x: 0.76, y: 0.10, char: 'M' },
            { x: 0.76, y: 0.12, char: 'M' },
            { x: 0.76, y: 0.14, char: 'M' },
            { x: 0.76, y: 0.16, char: 'M' },
            { x: 0.76, y: 0.18, char: 'M' },
            { x: 0.78, y: 0.10, char: 'M' },
            { x: 0.80, y: 0.12, char: 'M' },
            { x: 0.82, y: 0.14, char: 'M' },
            { x: 0.84, y: 0.16, char: 'M' },
            { x: 0.86, y: 0.10, char: 'M' },
            { x: 0.86, y: 0.12, char: 'M' },
            { x: 0.86, y: 0.14, char: 'M' },
            { x: 0.86, y: 0.16, char: 'M' },
            { x: 0.86, y: 0.18, char: 'M' },
            // M harfi (tekrar)
            { x: 0.90, y: 0.10, char: 'M' },
            { x: 0.90, y: 0.12, char: 'M' },
            { x: 0.90, y: 0.14, char: 'M' },
            { x: 0.90, y: 0.16, char: 'M' },
            { x: 0.90, y: 0.18, char: 'M' },
            { x: 0.92, y: 0.10, char: 'M' },
            { x: 0.94, y: 0.12, char: 'M' },
            { x: 0.96, y: 0.14, char: 'M' },
            { x: 0.98, y: 0.16, char: 'M' },
            { x: 0.98, y: 0.10, char: 'M' },
            { x: 0.98, y: 0.12, char: 'M' },
            { x: 0.98, y: 0.14, char: 'M' },
            { x: 0.98, y: 0.16, char: 'M' },
            { x: 0.98, y: 0.18, char: 'M' }
        ];

        // Pixel parçaları düşürme
        let fallingPieces = [];

        function createFallingPiece(pixelData, delay) {
            setTimeout(() => {
                const piece = document.createElement('div');
                piece.className = 'falling-piece';
                piece.style.left = (pixelData.x * 100) + '%';
                piece.style.top = '0%';
                piece.style.backgroundColor = pixelData.color;
                piece.style.animationDuration = (3 + Math.random() * 2) + 's';
                piece.style.animationDelay = delay + 's';
                document.body.appendChild(piece);

                // Parça düştükten sonra canvas'a çiz
                setTimeout(() => {
                    drawPixelOnCanvas(pixelData);
                    piece.remove();
                }, (3 + Math.random() * 2) * 1000);
            }, delay * 1000);
        }

        function drawPixelOnCanvas(pixel) {
            ctx.fillStyle = pixel.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = pixel.color;
            ctx.fillRect(pixel.x * canvas.width, pixel.y * canvas.height, 10, 10);
        }

        // Pixel yazıyı çiz
        function drawPixelText() {
            textPixels.forEach(pixel => {
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#fff';
                ctx.fillRect(pixel.x * canvas.width, pixel.y * canvas.height, 8, 8);
            });
        }

        // Gülü çiz
        function drawRose() {
            rosePixels.forEach(pixel => {
                ctx.fillStyle = pixel.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = pixel.color;
                ctx.fillRect(pixel.x * canvas.width, pixel.y * canvas.height, 10, 10);
            });
        }

        // Animasyon döngüsü
        function animate() {
            // Arka planı temizle
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Pixel yazıyı çiz
            drawPixelText();

            // Gülü çiz
            drawRose();

            // Yeni parçalar oluştur
            if (Math.random() < 0.3) {
                // Rastgele gül parçası düşür
                const randomPixel = rosePixels[Math.floor(Math.random() * rosePixels.length)];
                createFallingPiece(randomPixel, Math.random() * 2);
            }

            if (Math.random() < 0.2) {
                // Rastgele yazı parçası düşür
                const randomTextPixel = textPixels[Math.floor(Math.random() * textPixels.length)];
                createFallingPiece(randomTextPixel, Math.random() * 2);
            }

            requestAnimationFrame(animate);
        }

        // Mektup açma animasyonu
        function handleLoveClick() {
            const loveText = document.getElementById('loveText');
            const modal = document.getElementById('letterModal');

            // Yazıyı büyüt ve ışıldat
            loveText.classList.add('animate');

            // 2 saniye sonra mektubu aç
            setTimeout(() => {
                modal.style.display = 'flex';
                setTimeout(() => {
                    modal.classList.add('active');
                }, 100);
            }, 2000);
        }

        // Mektubu kapat
        function closeLetter() {
            const modal = document.getElementById('letterModal');
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 1000);
        }

        // Sayfa yüklendiğinde
        window.onload = function() {
            // Arka planı temizle
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Pixel yazıyı çiz
            drawPixelText();

            // Gülü çiz
            drawRose();

            // Animasyonu başlat
            animate();
        };

        // Pencere boyutlandığında
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawPixelText();
            drawRose();
        });
    </script>
</body>
</html>
